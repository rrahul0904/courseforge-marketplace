name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://courseforge:courseforge@localhost:5432/courseforge
      COURSEFORGE_SESSION_SECRET: ci-only-courseforge-session-secret-123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run prisma:validate
      - run: npm run typecheck
      - run: npm run build
